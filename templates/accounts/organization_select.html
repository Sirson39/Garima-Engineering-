{% extends "base.html" %}{% block title %}Choose organization{% endblock %}{% block content %}<div class="surface p-4" style="max-width: 680px; margin: 40px auto;"><div class="eyebrow">MULTIPLE ORGANIZATIONS</div><h1 class="dashboard-title">Choose your organization</h1><p class="dashboard-subtitle">You have approved access to more than one organization.</p>{% for membership in memberships %}<form method="post" class="mb-2">{% csrf_token %}<input type="hidden" name="organization_id" value="{{ membership.organization_id }}"><button class="btn btn-outline-primary w-100 text-start p-3" type="submit"><strong>{{ membership.organization.name }}</strong><small class="d-block text-muted">{{ membership.get_role_display }}</small></button></form>{% endfor %}</div>{% endblock %}
