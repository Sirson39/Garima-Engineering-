{% if page_obj.has_other_pages %}<nav class="d-flex justify-content-between align-items-center mt-4" aria-label="Pagination"><span class="text-muted small">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span><div class="d-flex gap-2">{% if page_obj.has_previous %}<a class="btn btn-sm btn-outline-secondary" href="?page={{ page_obj.previous_page_number }}&amp;q={{ request.GET.q|urlencode }}&amp;status={{ request.GET.status|urlencode }}&amp;location={{ request.GET.location|urlencode }}&amp;low={{ request.GET.low|urlencode }}&amp;start={{ request.GET.start|urlencode }}&amp;end={{ request.GET.end|urlencode }}">Previous</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-sm btn-outline-secondary" href="?page={{ page_obj.next_page_number }}&amp;q={{ request.GET.q|urlencode }}&amp;status={{ request.GET.status|urlencode }}&amp;location={{ request.GET.location|urlencode }}&amp;low={{ request.GET.low|urlencode }}&amp;start={{ request.GET.start|urlencode }}&amp;end={{ request.GET.end|urlencode }}">Next</a>{% endif %}</div></nav>{% endif %}
