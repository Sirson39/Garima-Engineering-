<div class="platform-confirmation" data-confirmation-dialog hidden aria-hidden="true">
  <div class="platform-confirmation-backdrop" data-confirmation-dismiss></div>
  <section class="platform-confirmation-modal" role="dialog" aria-modal="true" aria-labelledby="platform-confirmation-title" aria-describedby="platform-confirmation-body">
    <div class="platform-confirmation-main">
      <div class="platform-confirmation-icon" data-confirmation-icon><i data-lucide="triangle-alert"></i></div>
      <div class="platform-confirmation-copy"><h2 id="platform-confirmation-title" data-confirmation-title></h2><p id="platform-confirmation-body" data-confirmation-body></p></div>
    </div>
    <div class="platform-confirmation-context"><i data-lucide="building-2"></i><span data-confirmation-context></span></div>
    <div class="platform-confirmation-typing" data-confirmation-typing-wrapper hidden><label for="platform-confirmation-input">Type the organization name to continue</label><input id="platform-confirmation-input" type="text" autocomplete="off" data-confirmation-input></div>
    <div class="platform-confirmation-actions"><button type="button" class="platform-confirmation-cancel" data-confirmation-cancel>Cancel</button><button type="button" class="platform-confirmation-submit" data-confirmation-submit disabled></button></div>
  </section>
</div>
