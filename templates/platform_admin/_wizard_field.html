<div class="col-md-{{ span|default:'6' }}{% if hidden %} d-none{% endif %}"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="platform-required">*</span>{% else %}<span class="platform-optional">(optional)</span>{% endif %}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>
